<div class="about">
  <div nz-row [nzGutter]="[48, 48]">
    <div nz-col [nzXs]="24" [nzMd]="24" [nzLg]="16">
      <h3 class="section-title">关于实验室</h3>
      <p>XX实验室成立于2010年，是专注于材料科学与工程研究的前沿机构。我们拥有国际一流的实验设备和专业团队，致力于为科研人员提供最优质的实验条件。</p>
      <p>实验室目前拥有128台套先进设备，覆盖材料合成、结构表征、性能测试等全研究链条，每年支持超过50项国家级科研项目。</p>
      <div nz-row [nzGutter]="[24, 24]">
        <div nz-col [nzSpan]="8" class="item">
          <div class="icon-container">
            <nz-icon nzType="experiment" nzTheme="twotone" />
          </div>
          <div>
            <p>研究方向</p>
            <p>6大方向</p>
          </div>
        </div>
        <div nz-col [nzSpan]="8" class="item">
          <div class="icon-container">
            <nz-icon nzType="contacts" nzTheme="twotone" />
          </div>
          <div>
            <p>研究人员</p>
            <p>32名</p>
          </div>
        </div>
        <div nz-col [nzSpan]="8" class="item">
          <div class="icon-container">
            <nz-icon nzType="star" nzTheme="twotone" />
          </div>
          <div>
            <p>科研成果</p>
            <p>200+项</p>
          </div>
        </div>
      </div>
    </div>
    <div nz-col [nzXs]="24" [nzMd]="24" [nzLg]="8">
      <div nz-row [nzGutter]="[24, 24]">
        <img nz-col nzSpan="12" src="https://picsum.photos/id/237/600/400" alt="实验室环境" class="image">
